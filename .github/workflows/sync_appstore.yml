name: Sync genuine App Store screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/import_appstore.py'
      - 'scripts/extract_downhill_frames.py'
      - '.github/workflows/sync_appstore.yml'
  schedule:
    - cron: '20 5 1 * *'
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validator
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Download original App Store images
        run: python scripts/import_appstore.py
      - name: Install FFmpeg for authentic video-frame extraction
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Extract original DownhillSpotter demonstration frames
        run: python scripts/extract_downhill_frames.py
      - name: Commit original images
        run: |
          git add assets/screenshots assets/appstore-images.js
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Archive genuine App Store images and review video frames [skip ci]'
            git push
          fi
